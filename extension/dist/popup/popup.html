<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MusikKu Controller</title>
  <link rel="stylesheet" href="./popup.css" />
</head>
<body>
  <header class="brand">
    <span class="logo">M</span>
    <div>
      <h1>MusikKu Controller</h1>
      <p id="active-source">Memuat…</p>
    </div>
    <span id="status-chip" class="chip">…</span>
  </header>

  <section class="card" aria-label="Sedang diputar">
    <h2 id="media-title">—</h2>
    <p id="media-artist">—</p>
    <input id="seek" type="range" min="0" max="100" step="1" value="0" aria-label="Posisi putar" />
    <p id="media-time" class="muted">0:00 / 0:00</p>
    <div class="transport">
      <button id="btn-prev" aria-label="Sebelumnya">⏮</button>
      <button id="btn-play" aria-label="Putar atau jeda">▶</button>
      <button id="btn-next" aria-label="Berikutnya">⏭</button>
      <button id="btn-mute" aria-label="Bisukan tab">🔇</button>
    </div>
    <p id="cmd-note" class="muted" role="status"></p>
  </section>

  <section class="card" aria-label="Sumber">
    <h2>Sumber</h2>
    <ul id="source-list" class="sources"></ul>
  </section>

  <section class="card" aria-label="Pustaka lokal">
    <h2>Pustaka Lokal</h2>
    <label class="filebtn">+ Impor audio
      <input id="file-input" type="file" accept="audio/*" multiple class="sr" />
    </label>
    <ul id="track-list" class="tracks"></ul>
  </section>

  <section class="card" aria-label="Equalizer lokal">
    <h2>Equalizer <span class="muted">(audio lokal saja)</span></h2>
    <div id="eq-presets" class="presets" role="group" aria-label="Preset"></div>
    <div id="eq-sliders" class="sliders"></div>
    <p class="muted small">EQ tab lain dinonaktifkan: audio cross-origin tak dapat diproses sah &amp; teknis.</p>
    <button id="btn-capture" class="ghost">Cek capture tab aktif</button>
    <p id="capture-note" class="muted" role="status"></p>
  </section>

  <section class="card" aria-label="Akun MusikKu">
    <h2>Akun MusikKu <span class="muted">(opsional)</span></h2>
    <div id="auth-box"></div>
  </section>

  <script type="module" src="./popup.js"></script>
</body>
</html>
